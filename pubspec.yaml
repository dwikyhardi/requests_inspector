name: requests_inspector_plus
description: A Flutter package for logging REST-APIs and GraphQL requests with
  runtime capture gating, sensitive-data masking and GraphQL operation labelling,
  accessible by shaking your phone to open the RequestsInspector widget.
version: 1.0.0
homepage: https://github.com/dwikyhardi/requests_inspector
repository: https://github.com/dwikyhardi/requests_inspector
# we can add screenshots here using screenshots key
# please check this link https://dart.dev/tools/pub/pubspec#screenshots

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  gql: ^1.0.0+1
  graphql: ^5.2.4
  graphql_flutter: ^5.3.0
  provider: ^6.1.5+1
  sensors_plus: ^7.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: any
